
# =============================================================================
# .github/workflows/riv-ned-nettverk.yml
# Manuell og kontrollert nedriving av dev, test eller prod
# =============================================================================

name: Riv ned et miljø

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Miljø som skal rives ned
        type: choice
        options:
          - dev
          - test
          - prod
        required: true

      bekreftelse:
        description: 'Skriv "riv ned <miljø>" for å bekrefte'
        type: string
        required: true

      begrunnelse:
        description: Hvorfor river du ned?
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: nettverk-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Jobb 1: Kontroller bekreftelsen før Azure brukes
  # ---------------------------------------------------------------------------
  bekreft:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk bekreftelsen
        env:
          BEKREFTELSE: ${{ inputs.bekreftelse }}
          MILJO: ${{ inputs.environment }}
          BEGRUNNELSE: ${{ inputs.begrunnelse }}
        run: |
          if [ "$BEKREFTELSE" != "riv ned $MILJO" ]; then
            echo "::error::Ikke bekreftet. Forventet: riv ned $MILJO"
            exit 1
          fi

          if [ -z "$BEGRUNNELSE" ]; then
            echo "::error::Begrunnelse mangler."
            exit 1
          fi

          echo "Bekreftelse godkjent."
          echo "Begrunnelse: $BEGRUNNELSE"

  # ---------------------------------------------------------------------------
  # Jobb 2: Planlegg og gjennomfør nedriving
  # ---------------------------------------------------------------------------
  riv-ned:
    needs: bekreft
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: oving6/stacks/nettverk

    env:
      MILJO: ${{ inputs.environment }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila fra Key Vault
        env:
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
        run: |
          az keyvault secret show \
            --vault-name "$KEYVAULT_NAME" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Initialiser Terraform
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oving6/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/nettverk.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Vis destroy-planen
        run: terraform show -no-color tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at Terraform-state er tom
        run: |
          remaining=$(terraform state list)

          if [ -n "$remaining" ]; then
            echo "::error::Terraform-state inneholder fortsatt ressurser."
            echo "$remaining"
            exit 1
          fi

          echo "Terraform-state er tom. Nedriving fullført."

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
