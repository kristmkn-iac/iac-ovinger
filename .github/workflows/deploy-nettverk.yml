
name: Rull ut nettverk

on:
  push:
    branches: [main]
    paths:
      - 'oving6/stacks/nettverk/**'
      - 'oving6/modules/network/**'
      - 'oving6/shared/backend.hcl'
      - '.github/workflows/deploy-nettverk.yml'
      - '.github/workflows/terraform-miljo.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/terraform-miljo.yml
    with:
      environment: dev
      commit_sha: ${{ github.sha }}
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/terraform-miljo.yml
    with:
      environment: test
      commit_sha: ${{ github.sha }}
    secrets: inherit

  prod:
    needs: test
    uses: ./.github/workflows/terraform-miljo.yml
    with:
      environment: prod
      commit_sha: ${{ github.sha }}
    secrets: inherit
